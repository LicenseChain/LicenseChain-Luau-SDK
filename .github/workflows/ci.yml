name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if(!p.version) process.exit(1); console.log('ok', p.version)"
      - name: Check Wally version sync
        run: |
          node -e "
            const fs=require('fs');
            const pkg=require('./package.json');
            const w=fs.readFileSync('wally.toml','utf8');
            const m=w.match(/^version\\s*=\\s*\"([^\"]+)\"/m);
            if(!m||m[1]!==pkg.version){console.error('wally/package version mismatch', m&&m[1], pkg.version); process.exit(1);}
            console.log('versions synced', pkg.version);
          "
